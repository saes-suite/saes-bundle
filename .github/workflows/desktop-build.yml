name: Desktop Multi-Platform Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "Tag name to publish GitHub Release (e.g. v0.2.0)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref/tag to checkout"
        required: false
        type: string
        default: ""
      use_release_metadata:
        description: "Overlay bumped version files from release-metadata artifact"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build SAES Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            artifact_name: "saes-desktop-macos-arm64"
          - platform: "macos-15-intel"
            target: "x86_64-apple-darwin"
            artifact_name: "saes-desktop-macos-x64"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            artifact_name: "saes-desktop-linux-x64"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            artifact_name: "saes-desktop-windows-x64"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout umbrella and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: recursive

      - name: Apply bumped release metadata
        if: inputs.use_release_metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install saes-ui dependencies
        run: pnpm --dir saes-ui install --frozen-lockfile

      - name: Build unified Python backend sidecar (saes + saes-ai)
        run: python packaging/build_backend.py --target ${{ matrix.target }}

      - name: Build Tauri Desktop Application (manual / non-release)
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')"
        run: node saes-ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }}

      - name: Upload Desktop Installers as Workflow Artifacts
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Build & Publish Tauri Desktop Release (tag v* or release_tag)
        if: "startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "SAES v__VERSION__"
          releaseBody: "Automated multi-platform desktop installers for SAES (UI + Statistical API + AI Assistant)."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: "startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Apply bumped release metadata
        if: inputs.use_release_metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .

      - name: Publish draft release once all platforms succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, re

          version = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(text)
          if match:
              pathlib.Path("release_notes.md").write_text(
                  match.group(0).strip() + "\n", encoding="utf-8"
              )
          EOF
          if [ -s release_notes.md ]; then
            gh release edit "$TAG" --notes-file release_notes.md --draft=false --repo "${{ github.repository }}"
          else
            gh release edit "$TAG" --draft=false --repo "${{ github.repository }}"
          fi
